<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/small.css">
    <link rel="stylesheet" href="css/medium.css">
    <title>Site Futuriza</title>
</head>
<body>
    <header>
        <section class="logoCompleto">
            <img src="assets/img/Logo.png" alt="Logo da Futuriza: duas letras f invertida em relação à outra">
            <div class="linkHome"><a href="index.html"><h1>FUTURIZA</h1></a></div>
        </section>
        <nav>
            <a href="sobre.html">Projeto</a>
            <a href="integrantes.html">Equipe</a>
            <a href="faq.html">FAQ</a>
            <a href="contato.html">Fale conosco</a>
            <a href="futuriza.html">Serviços</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <main class="mainLogin">
    <section>
        <h1>Seja Bem Vindo!</h1>
        <h2>Entre e começe a mudança para o futuro já.</h2>
        <img src="assets/img/fundoLogin.avif" alt="Linhas se cruzando criando polígonos em tons de roxo">
    </section>

    <section class="login-container">
        <div class="login-header">
            <h2 class="login-titulo">Faça seu Login</h2>
            <div class="ligar-buttons">
                <button id="ligarEmpresarial" class="ativo">Empresarial</button>
                <button id="ligarParticular">Particular</button>
            </div>
        </div>

        <form id="loginForm" class="login-form">
            <div class="entradaDados">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com" required>
            </div>
            <div class="entradaDados">
                <label for="password">Senha</label>
                <input type="password" id="password" name="password" placeholder="********" required>
            </div>
            
            <p class="esqueceuSenha"><a href="#">Esqueceu a senha?</a></p>

            <button type="submit" class="login-button">Entrar</button>

            <p class="linkCadastro">Não tem uma conta? <a href="#">Cadastre-se</a></p>
        </form>
    </section>
    </main>
    <footer class="footer-futuriza">
        <p>1TDSPA - Pedro B. RM567478 | Lucas D. RM567600 | Ilda M. RM568233</p>
    </footer>
    <script src="js/script.js"></script>
</body>
</html>
